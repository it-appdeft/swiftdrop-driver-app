name: swiftdrop_driver_app
description: SwiftDrop Driver — Production delivery partner application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management, routing & DI
  get: ^4.6.6
  get_storage: ^2.1.1

  # Networking
  dio: ^5.7.0

  # Environment configuration
  flutter_dotenv: ^5.2.1

  # Firebase
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Shimmer loading
  shimmer: ^3.0.0

  # Connectivity
  connectivity_plus: ^6.1.0

  # WebSocket (Laravel Reverb via Pusher protocol)
  dart_pusher_channels: ^1.3.1

  # Maps & location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  logger: ^2.5.0
  flutter_svg: ^2.0.16
  url_launcher: ^6.3.0
  package_info_plus: ^8.1.2
  device_info_plus: ^11.1.3

  # Typography — Inter font
  google_fonts: ^6.2.1
  country_picker: ^2.0.28
  image_cropper: ^12.2.1
  file_picker: ^11.0.3
  syncfusion_flutter_charts: ^34.2.4
  dropdown_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
